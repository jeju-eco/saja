<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19352f"><meta name="description" content="사야 할 것과 사고 싶은 것을 한곳에, 오프라인으로"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"><title>뭐 사야 하지?</title></head><body>
<main class="shell"><header><span class="eyebrow">내 주머니 속 목록</span><h1>뭐 사야 하지<span>?</span></h1><p>필요한 건 지금, 갖고 싶은 건 나중에.</p></header>
<nav class="tabs" aria-label="목록"><button data-tab="buy" class="active" aria-selected="true">사야 하지 <b data-count="buy"></b></button><button data-tab="want" aria-selected="false">사고 싶지 <b data-count="want"></b></button><button data-tab="done" aria-selected="false">샀음 <b data-count="done"></b></button></nav>
<form id="form" autocomplete="off"><label for="name" class="sr">물건 이름</label><input id="name" maxlength="100" placeholder="뭐가 필요해?" required><button id="add" type="submit" aria-label="목록에 추가">＋ 추가</button></form>
<p id="status" role="status" aria-live="polite"></p><section id="items" aria-label="물건 목록"></section>
<details class="settings"><summary>백업 · 복원 · 사용 안내</summary><p>목록은 이 기기의 이 브라우저에만 저장됩니다. 다른 기기나 다른 브라우저에는 자동으로 옮겨지지 않아요. 브라우저 데이터를 지우면 백업하지 않은 기록은 되살릴 수 없습니다.</p><div class="setting-actions"><button id="export" type="button">백업 내려받기</button><label class="import-label" for="import">백업 복원</label><input id="import" type="file" accept=".json,application/json" hidden></div><p id="backupStatus" role="status"></p></details>
</main><script src="core.js"></script><script src="store.js"></script><script src="backup.js"></script><script src="app.js"></script></body></html>
